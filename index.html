<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>DINO RUN | Titan Arc Studios</title>
  <meta name="description" content="Play Dino Run by Titan Arc Studios - Fast-paced prehistoric action runner.">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  
  <!-- Preload tags for fast WebGL game startup -->
  <link rel="preload" href="Build/DinoRunWeb.loader.js" as="script">
  <link rel="preload" href="TemplateData/logo.png" as="image">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-wrapper">

    <!-- Top Navigation Header -->
    <header class="site-header">
      <div class="container">
        <nav class="header-nav">
          <a href="https://titanarcstudios.com/" class="brand-logo" aria-label="Titan Arc Studios Home">
            <img src="TemplateData/logo.png" alt="Titan Arc Studios Logo" class="brand-logo-img">
            <div class="brand-info">
              <span class="brand-name">TITAN ARC</span>
              <span class="brand-sub">STUDIOS</span>
            </div>
          </a>

          <!-- Pure DINO RUN Title -->
          <div class="header-game-title">DINO RUN</div>

          <div class="header-actions">
            <!-- Back to Games redirects directly to https://titanarcstudios.com/ -->
            <a href="https://titanarcstudios.com/" class="btn-secondary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              <span>Back to Games</span>
            </a>
            <button class="btn-primary" id="btn-header-fullscreen" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              <span>Fullscreen</span>
            </button>
          </div>
        </nav>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="container">
        <section class="game-stage-section">
          <div class="game-stage-card" id="unity-container">
            
            <!-- Canvas Aspect Ratio Wrapper -->
            <div class="canvas-wrapper">
              
              <!-- Unity WebGL Canvas -->
              <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

              <!-- Light Preloader Loading Overlay -->
              <div class="loading-overlay" id="unity-loading-bar">
                <img src="TemplateData/logo.png" alt="Titan Arc Studios Logo" class="loading-logo-img">
                <h1 class="loading-title">DINO RUN</h1>
                <span class="loading-subtitle">Titan Arc Studios</span>

                <div class="loading-bar-container">
                  <div class="loading-bar-track">
                    <div class="loading-bar-fill" id="unity-progress-bar-full"></div>
                  </div>
                </div>

                <div class="loading-status-group">
                  <span class="loading-status-text" id="loading-status-text">Loading Engine...</span>
                  <span class="loading-percentage" id="loading-percentage-text">0%</span>
                </div>
              </div>

              <!-- Warning Banner Container -->
              <div class="unity-warning-container" id="unity-warning"></div>
            </div>

            <!-- Minimal Control Toolbar under Game Canvas -->
            <div class="game-control-bar" id="unity-footer">
              <div class="control-status">
                <span class="status-dot"></span>
                <span>System Ready</span>
              </div>
              <div class="control-buttons">
                <button class="ctrl-btn" id="btn-focus-canvas" type="button" title="Click to focus controls">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
                  <span>Focus Game</span>
                </button>
                <button class="ctrl-btn" id="btn-reload-game" type="button" title="Reload Game">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                  <span>Reload</span>
                </button>
                <button class="ctrl-btn" id="unity-fullscreen-button" type="button" title="Fullscreen Mode">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                  <span>Fullscreen</span>
                </button>
              </div>
            </div>

          </div>
        </section>
      </div>
    </main>

    <!-- Clean Minimal Footer -->
    <footer class="site-footer">
      <div class="container">
        <div class="footer-content">
          <img src="TemplateData/logo.png" alt="Titan Arc Logo" class="footer-logo">
          <span>© Titan Arc Studios. All rights reserved.</span>
        </div>
      </div>
    </footer>

  </div>

  <!-- Mobile Landscape Orientation Overlay -->
  <div class="rotate-overlay">
    <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18h.01"/>
      <path d="M19 9l3 3-3 3"/>
      <path d="M5 15l-3-3 3-3"/>
    </svg>
    <h2 class="rotate-title">Rotate Your Device</h2>
    <p class="rotate-text">Please turn your device horizontally (landscape mode) to play Dino Run.</p>
  </div>

  <!-- Unity WebGL Loader Script -->
  <script>
    (function() {
      var canvas = document.querySelector("#unity-canvas");
      var loadingOverlay = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var progressText = document.querySelector("#loading-percentage-text");
      var statusText = document.querySelector("#loading-status-text");
      var unityContainer = document.querySelector("#unity-container");

      function unityShowBanner(msg, type) {
        var warningContainer = document.querySelector("#unity-warning");
        var div = document.createElement('div');
        div.className = 'unity-toast ' + (type === 'error' ? 'error' : 'warning');
        div.innerHTML = msg;
        warningContainer.appendChild(div);

        if (type !== 'error') {
          setTimeout(function() {
            if (div.parentNode) div.parentNode.removeChild(div);
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/DinoRunWeb.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/DinoRunWeb.data.br",
        frameworkUrl: buildUrl + "/DinoRunWeb.framework.js.br",
        codeUrl: buildUrl + "/DinoRunWeb.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Titan Arc Studios",
        productName: "Dino Run",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      function updateLoadingStage(pct) {
        if (pct < 25) {
          statusText.textContent = "Loading Engine...";
        } else if (pct < 65) {
          statusText.textContent = "Decompressing Assets...";
        } else if (pct < 90) {
          statusText.textContent = "Initializing WebAssembly...";
        } else {
          statusText.textContent = "Starting Dino Run...";
        }
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          var pct = Math.round(100 * progress);
          progressBarFull.style.width = pct + "%";
          progressText.textContent = pct + "%";
          updateLoadingStage(pct);
        }).then(function(unityInstance) {
          loadingOverlay.classList.add("hidden");

          var toggleFullscreen = function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
              if (unityContainer.requestFullscreen) {
                unityContainer.requestFullscreen();
              } else if (unityContainer.webkitRequestFullscreen) {
                unityContainer.webkitRequestFullscreen();
              } else {
                unityInstance.SetFullscreen(1);
              }
            } else {
              if (document.exitFullscreen) {
                document.exitFullscreen();
              } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
              }
            }
          };

          document.querySelector("#unity-fullscreen-button").onclick = toggleFullscreen;
          document.querySelector("#btn-header-fullscreen").onclick = toggleFullscreen;

          document.querySelector("#btn-focus-canvas").onclick = function() {
            canvas.focus();
          };

          canvas.addEventListener("click", function() {
            canvas.focus();
          });

        }).catch(function(message) {
          unityShowBanner("Failed to initialize game: " + message, "error");
        });
      };

      document.body.appendChild(script);

      document.querySelector("#btn-reload-game").onclick = function() {
        window.location.reload();
      };
    })();
  </script>
</body>
</html>
